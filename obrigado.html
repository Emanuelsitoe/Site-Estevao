<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagem Enviada</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    
    
    <style>
        /* CSS Específico In-line para facilitar (pode mover para o style.css) */
        
        body {
            /* Garante que o fundo seja o mesmo off-white elegante */
            background-color: var(--light); 
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thank-you-section {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .thank-you-card {
            background: var(--white);
            max-width: 600px;
            width: 100%;
            padding: 60px 40px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.05);
            border-top: 4px solid var(--gold);
            position: relative;
            overflow: hidden;
            
            /* Estado inicial para animação */
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* Ícone de Sucesso */
        .icon-wrapper {
            width: 80px;
            height: 80px;
            background: rgba(197, 160, 89, 0.1); /* Dourado bem suave */
            color: var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 30px;
            
            /* Animação do ícone */
            transform: scale(0);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.3s forwards;
        }

        /* Tipografia */
        .thank-you-card h1 {
            font-family: var(--font-serif);
            color: var(--dark);
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .thank-you-card p {
            font-family: var(--font-sans);
            color: #666;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Decoração Musical de Fundo */
        .musical-bg {
            position: absolute;
            bottom: -20px;
            left: -20px;
            font-size: 10rem;
            color: rgba(0,0,0,0.02);
            transform: rotate(-15deg);
            z-index: 0;
            pointer-events: none;
        }

        /* Botão */
        .btn-home {
            position: relative;
            z-index: 2;
            padding: 15px 40px;
            transition: all 0.3s ease;
        }
        
        .btn-home i {
            margin-right: 8px;
            font-size: 0.9rem;
            transition: transform 0.3s;
        }
        
        .btn-home:hover i {
            transform: translateX(-5px);
        }

        /* Keyframes de Animação */
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes popIn {
            to {
                transform: scale(1);
            }
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .thank-you-card { padding: 40px 20px; }
            .thank-you-card h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <section class="thank-you-section">
        <div class="thank-you-card">
            <div class="musical-bg">
                <i class="fas fa-music"></i>
            </div>

            <div class="icon-wrapper">
                <i class="fas fa-check"></i>
            </div>

            <h1>Obrigado</h1>
            <p>Sua mensagem foi recebida com sucesso. Agradeço o interesse em meu trabalho e retornarei o contacto em breve.</p>

            <a href="index.html" class="btn btn-primary btn-home">
                <i class="fas fa-arrow-left"></i> Voltar ao Início
            </a>
        </div>
    </section>

</body>
</html>
